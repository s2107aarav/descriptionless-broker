name: broker-boundaries
on: [push, pull_request]
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m evals.research_provenance verify
      - run: python -m evals.run --mode offline --out .runtime/research-evaluation.json
      - run: python -m evals.gateway_evaluate --out .runtime/gateway-evaluation.json
      - run: python -m evals.expansion_evaluate --out .runtime/expansion-evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: evaluations-${{ matrix.os }}
          path: |
            .runtime/*evaluation.json
            .runtime/expansion-evaluation/**
          include-hidden-files: true
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm exec -- tsc --noEmit
